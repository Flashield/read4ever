[package]
name = "readbook"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "readbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
flate2 = "1"
glob = "0.3"
trash = "5"
# SMB 远程浏览：纯 Rust 客户端（tokio 异步），无 FFI——保证 iOS/Windows 目标可编译。
# 局限：仅 SMB2/3（不支持 SMB1）；0.x API 可能变动，升级需单独评估。
smb2 = "0.35"
# 直用其 time（超时包装）；tokio 已随 tauri 在依赖树中，仅显式声明
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
