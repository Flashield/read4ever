[package]
name = "Read4Ever"
version = "2026.10.30"
description = "My Reading Apps"
authors = ["Flashield"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "read4ever_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chardetng = "0.1"
flate2 = "1"
glob = "0.3"
trash = "5"
# SMB 远程浏览：纯 Rust 客户端（tokio 异步），无 FFI——保证 iOS/Windows 目标可编译。
# 局限：仅 SMB2/3（不支持 SMB1）；0.x API 可能变动，升级需单独评估。
smb2 = "0.35"
# SMB 密码落盘加密：文件内 AES-256-GCM（内存中始终明文，仅 save/load 边界处理）。
# 均为 RustCrypto 纯 Rust，iOS 门禁安全。方案见 docs/spec/SMB含子目录与密码加密方案.md
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
# 流式播放协议 URL 路径的 percent 编解码（tauri 传递依赖，显式声明以直接使用）
percent-encoding = "2"
# 与 tauri 同源的数据目录解析（无 AppHandle 时复算 app_data_dir；tauri 依赖树已含）
dirs = "7"
# 直用其 time（超时包装）与 rt（JoinSet 并发分块读）；tokio 已随 tauri 在依赖树中，仅显式声明
tokio = { version = "1", features = ["time", "rt"] }

# 屏幕常亮（docs/屏幕常亮方案.md）：keepawake 仅桌面三平台引入。
# iOS 不支持（落地时在 wake.rs 用 objc2-ui-kit 设 idleTimerDisabled 自实现）；
# 门控先例：iOS 方案中 tray-icon feature 与 trash crate 同样按目标门控。
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
keepawake = "0.6"
# 默认单实例：重复启动唤起已有窗口（docs/spec/托盘暂停与单实例多开方案.md）
tauri-plugin-single-instance = "2"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
