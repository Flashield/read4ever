# Read4Ever 多平台自动构建：打 tag 触发，产物挂到 GitHub Release 草稿
name: Release Build

on:
  push:
    tags:
      - 'v*'        # 推送 v 开头的 tag 时触发，如 v0.1.0
  workflow_dispatch: # 允许在 Actions 页面手动触发（仅生成 artifact，不建 Release）

jobs:
  build:
    # tauri-action 要创建 Release，必须有 contents 写权限
    permissions:
      contents: write
    # fail-fast: false —— 某个平台失败不取消其余平台，互不影响
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS Apple Silicon（原生编译）
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # macOS Intel（在 arm64 机器上交叉编译，省一台 macos-13 老机器）
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          # Linux（ubuntu-22.04：webkit2gtk-4.1 依赖最稳）
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,rpm'
          # Windows（安装包：msi + NSIS setup.exe）
          - platform: 'windows-latest'
            args: ''
          # Windows 绿色版（--no-bundle 不打包安装器，只上传裸 exe）
          - platform: 'windows-latest'
            args: '--no-bundle'
            plainBinary: true

    runs-on: ${{ matrix.settings.platform }}
    steps:
      # 拉取仓库代码
      - uses: actions/checkout@v5

      # 装 Node 22（vite 8 要求 node ≥ 20.19），并缓存 npm 下载目录
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 装 Rust stable；macOS 两个 job 额外装双架构编译目标
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Rust 编译产物（target/ 与 ~/.cargo），首次之后的构建快数倍
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true # 失败也存缓存，重跑时不必全量重编译

      # Linux 需要 GTK/WebKit 等系统库才能编译 Tauri
      - name: 安装 Linux 系统依赖
        if: matrix.settings.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 按 package-lock.json 精确安装前端依赖
      - name: 安装前端依赖
        run: npm ci

      # 核心：执行 tauri build（自动先跑 beforeBuildCommand = npm run build），
      # 打包各平台安装包并上传到 Release 草稿
      - uses: tauri-apps/tauri-action@v0
        env:
          # GitHub 自动注入的令牌，用于创建 Release 和上传产物
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 应用名/版本自动读 tauri.conf.json 的 productName/version，无需手传
          projectPath: .
          # 产物统一命名：名字_版本_系统_架构[_setup].扩展名
          # [_setup] 仅 NSIS 安装包展开为 _setup，绿色版 exe 为空 → 与安装版区分
          releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][_setup].[ext]'
          # 仅 Windows 绿色版条目上传裸 exe（--no-bundle 时编译产物就是可执行文件）
          uploadPlainBinary: ${{ matrix.settings.plainBinary == true }}
          tagName: ${{ github.ref_name }}                    # Release 的 tag = 触发的 tag
          releaseName: 'Read4Ever ${{ github.ref_name }}'
          releaseBody: '各平台安装包见下方 Assets。'
          releaseDraft: true   # 先建草稿，人工检查后再点发布
          prerelease: false
          args: ${{ matrix.settings.args }}
